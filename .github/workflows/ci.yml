name: CI

# Every Pull Request builds the repository and runs its tests on a clean machine.
# "It works on my computer" is not evidence; a green check here is.
# Only Pull Requests into develop and qa (instructor's rule, git-conventions.md).

on:
  pull_request:
    branches: [develop, qa]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The integration tests run against the real engine with the schema of
    # property-notification-db applied (Annex C): the same PostgreSQL major version,
    # prepared the way property-infra-postgres prepares the shared instance.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: property
          POSTGRES_USER: property_admin
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U property_admin -d property"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The consumer of notification.reservas is tested against a real broker: the test declares
      # its own queue and deletes it (RabbitMQ 3.13, the version of property-infra-rabbitmq).
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci_admin
          RABBITMQ_DEFAULT_PASS: ci-only
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      TEST_BROKER_URL: amqp://ci_admin:ci-only@localhost:5672/%2F
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/property
      TEST_DATABASE_USER: notification_app
      TEST_DATABASE_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/property-notification-db
          ref: develop
          path: .notification-db
      - name: Prepare the instance and apply the notification schema
        run: |
          docker run --rm -i --network host -e PGPASSWORD=ci-only postgres:16 \
            psql -h localhost -U property_admin -d property -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE ROLE notification_app LOGIN PASSWORD 'ci-only';
          ALTER ROLE notification_app SET search_path = notification;
          SQL
          docker run --rm --network host -v "$PWD/.notification-db:/workspace:ro" liquibase/liquibase:4.29 \
            --search-path=/workspace --changelog-file=changelog/changelog-master.yaml \
            --url=jdbc:postgresql://localhost:5432/property \
            --username=property_admin --password=ci-only \
            --database-changelog-table-name=databasechangelog_notification \
            --database-changelog-lock-table-name=databasechangeloglock_notification update
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
