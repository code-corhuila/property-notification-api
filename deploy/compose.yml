# This service only. property-infra-postgres includes this file to compose the platform.

services:
  notification-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "3005"
      # Public key of identity-service, one line with \n escapes. Never versioned.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY}
      # The schema notification of the single PostgreSQL instance, as notification_app (Annex J.7).
      DATABASE_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}
      DATABASE_USER: notification_app
      DATABASE_PASSWORD: ${NOTIFICATION_APP_PASSWORD:?set NOTIFICATION_APP_PASSWORD}
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["3005"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
